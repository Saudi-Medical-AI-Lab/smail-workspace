name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: smail-mcp
        working-directory: smail-mcp
        run: npm ci && npm run typecheck && npm test
      - name: smail-slack-bot
        working-directory: smail-slack-bot
        run: npm ci && npm run typecheck && npm test
