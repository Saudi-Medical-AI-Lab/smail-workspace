display_information:
  name: SMAIL Site Bot
features:
  bot_user:
    display_name: smail-bot
    always_online: true
oauth_config:
  scopes:
    bot: [app_mentions:read, chat:write, files:read, channels:history, groups:history]
settings:
  event_subscriptions:
    request_url: https://bot.example.com/slack/events
    bot_events: [app_mention, message.channels, message.groups]
  interactivity:
    is_enabled: true
    request_url: https://bot.example.com/slack/events
  org_deploy_enabled: false
  socket_mode_enabled: false
